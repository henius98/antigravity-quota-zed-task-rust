[package]
name = "antigravity-quota"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Check Google Antigravity quota using OAuth credentials created by Zed's Antigravity ACP integration."

[dependencies]
anyhow = "1.0.104"

reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
